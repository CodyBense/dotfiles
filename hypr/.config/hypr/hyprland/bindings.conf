$mainMod = Super
# $terminal = kitty
$terminal = ghostty
$broswer = zen-browser
$fileManager = dolphin
$menu = wofi --show drun

# Applications
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, launch-file-manager
bind = $mainMod, SPACE, exec, $scrPath/rofi-launch
bind = $mainMod, F, exec, zen-browser 
# bind = $mainMod, M, exec, flatpak run com.spotify.Client
bind = $mainMod, M, exec, spotify
# bind = $mainMod, O, exec, flatpak run md.obsidian.Obsidian
bind = $mainMod, O, exec, obsidian

# Utilites
bind = $mainMod, BACKSPACE, exec, wlogout
bind = $mainMod, PERIOD, exec, $scrPath/emojipicker
bind = $mainMod ALT, L, exec, hyprlock 
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = $mainMod SHIFT, W, exec, bash $scrPath/rofi-wallpaper
bind = , PrintScreen, exec, /home/codybense/.config/ags/services/snapshot
bind = $mainMod SHIFT, M, exec, $scrPath/hyprland-monitor-toggle
bind = $mainMod SHIFT, R, exec, $scrPath/restart-waybar
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, N, exec, $scrPath/rofi-notes
bind = $mainMod SHIFT, T, exec, $scrPath/change-theme

# Window management
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, V, fullscreen 
bind = $mainMod, P, pseudo,
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, movewindow, l 
bind = $mainMod SHIFT, L, movewindow, r 
bind = $mainMod SHIFT, K, movewindow, u 
bind = $mainMod SHIFT, J, movewindow, d 
bind = $mainMod CTRL, H, resizeactive, -30 0 
bind = $mainMod CTRL, L, resizeactive, 30 0 
bind = $mainMod CTRL, J, resizeactive, 0 -30 
bind = $mainMod CTRL, K, resizeactive, 0 30 
## Workspaces
bind = $mainMod, 1, workspace, 1 
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1 
bind = $mainMod SHIFT, 2, movetoworkspace, 2 
bind = $mainMod SHIFT, 3, movetoworkspace, 3 
bind = $mainMod SHIFT, 4, movetoworkspace, 4 
bind = $mainMod SHIFT, 5, movetoworkspace, 5 
bind = $mainMod SHIFT, 6, movetoworkspace, 6 
bind = $mainMod SHIFT, 7, movetoworkspace, 7 
bind = $mainMod SHIFT, 8, movetoworkspace, 8 
bind = $mainMod SHIFT, 9, movetoworkspace, 9 
bind = $mainMod SHIFT, 0, movetoworkspace, 10 
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1 
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2 
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3 
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4 
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5 
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6 
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7 
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8 
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9 
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10 
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod SHIFT, I, togglesplit
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, Q, killactive,
bind = $mainMod, DELETE, exit,
