source=~/.config/hypr/hyprland/bindings.conf
$scrPath = $HOME/bin

# monitor=,preferred,auto,auto
monitor=,preferred,auto,1

exec = $scrPath/hyprland-monitor-toggle

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpaper
exec-once = $scrPath/start-hyprland
# exec-once = killall -q swww;sleep .5 && swww-daemon
# exec-once = killall -q waybar;sleep .5 && waybar
# exec-once = killall -q agsv1; sleep .5 && agsv1
# exec-once = killall -q swaync;sleep .5 && swaync
# exec-once = nm-applet --indicator
exec-once = lxqt-policykit-agent
# exec-once = sleep 1.5 && swww img /home/codybense/Pictures/wallpapers/tux.png

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = PATH,$PATH:$scrPath
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,1

input {
    kb_layout = us
    follow_mouse = 2

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0
}

device {
    name = epice mouse V1
    sensitivity = -0.5
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

dwindle {
    pseudotile = yes
    preserve_split = yes
    # no_gaps_when_only = 1
    force_split = 2
}

master {
    new_status = master
}

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

xwayland {
    force_zero_scaling = true
}

animations {
    enabled = no
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}


windowrule = float, title:file-manager
windowrule = size 1500 1000, title:file-manager
windowrule = float, title:nmtui
windowrule = size 1500 1000, title:nmtui

